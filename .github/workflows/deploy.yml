name: Deploy Fishing Bot & WebApp

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install WebApp dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Build WebApp
        run: |
          if [ -f package.json ]; then npm run build; fi

  deploy-to-server:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
    steps:
      - name: Deploy via SSH to VPS
        if: ${{ env.SERVER_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            echo "Searching for project directory on server..."
            if [ -d "/root/fishing_bot" ]; then
              cd "/root/fishing_bot"
            elif [ -d "/root/fishing-app" ]; then
              cd "/root/fishing-app"
            else
              TARGET_DIR=$(find /root /var/www /home -maxdepth 3 -name "bot.py" 2>/dev/null | head -n 1 | xargs -r dirname)
              if [ -n "$TARGET_DIR" ] && [ -d "$TARGET_DIR" ]; then
                cd "$TARGET_DIR"
              fi
            fi
            echo "Current directory: $(pwd)"
            git pull origin main || git pull || true
            chmod +x ./deploy.sh
            ./deploy.sh
